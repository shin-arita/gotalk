services:
  frontend:
    build:
      context: ./frontend
    container_name: ${CONTAINER_PREFIX:-gotalk}-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_BACKEND_URL=http://backend:8080
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: ${CONTAINER_PREFIX:-gotalk}-backend
    restart: unless-stopped
    # The backend waits up to 25s for in-flight requests on SIGTERM (graceful shutdown).
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}

  backend-dev:
    profiles: ["dev"]
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
      - ./frontend/src/languages.ts:/frontend/src/languages.ts:ro
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
    entrypoint: [""]
