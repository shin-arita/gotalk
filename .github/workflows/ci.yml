name: CI

on:
  push:
    branches: [main]
  pull_request:
  # cd-staging.yml から呼び出す。ref には deploy するコミットを渡す
  workflow_call:
    inputs:
      ref:
        description: "checkout するコミット（省略時は既定のコミット）"
        type: string
        required: false

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint / test / coverage / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          # push と pull_request では inputs.ref が空なので、今までどおり既定のコミットを checkout する
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  backend:
    name: Backend (vet / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          # push と pull_request では inputs.ref が空なので、今までどおり既定のコミットを checkout する
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          check-latest: true
          cache-dependency-path: backend/go.sum

      - name: Gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o /tmp/gotalk-backend .
